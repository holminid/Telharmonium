name: Restore damaged example MP3 recordings
on:
  push:
    paths:
      - '.upload-staging/fix-audio/**'
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Restore original MP3s with integrity checks
        shell: bash
        run: |
          set -euo pipefail
          cat .upload-staging/fix-audio/1918-lyrical-symphony.mp3/part-*.b64 | base64 --decode > assets/audio/1918-lyrical-symphony.mp3
          echo "e4d863e2dfc4841843e8f0d71f85bcbe29f21127e241deec814db4005b84cf99  assets/audio/1918-lyrical-symphony.mp3" | sha256sum --check
          test "$(wc -c < assets/audio/1918-lyrical-symphony.mp3)" -eq 4465772
          cat .upload-staging/fix-audio/1920-delta-blues.mp3/part-*.b64 | base64 --decode > assets/audio/1920-delta-blues.mp3
          echo "2de563902310c822d25b8e38b87ab11720fc87c47627eb387b1b7ebc553981a0  assets/audio/1920-delta-blues.mp3" | sha256sum --check
          test "$(wc -c < assets/audio/1920-delta-blues.mp3)" -eq 6827904
          cat .upload-staging/fix-audio/1932-big-band-ensemble-i.mp3/part-*.b64 | base64 --decode > assets/audio/1932-big-band-ensemble-i.mp3
          echo "46c707d5b5d55e109ed8ac1e473071033a69b578cba87dc35615bcceeba59e2d  assets/audio/1932-big-band-ensemble-i.mp3" | sha256sum --check
          test "$(wc -c < assets/audio/1932-big-band-ensemble-i.mp3)" -eq 2640082
          cat .upload-staging/fix-audio/1932-big-band-ensemble-ii.mp3/part-*.b64 | base64 --decode > assets/audio/1932-big-band-ensemble-ii.mp3
          echo "73e03bb27bfbfa7ab8e68e3591294c74d2fb87219fd36eb04446a965e1215339  assets/audio/1932-big-band-ensemble-ii.mp3" | sha256sum --check
          test "$(wc -c < assets/audio/1932-big-band-ensemble-ii.mp3)" -eq 2569238
      - name: Commit repairs and delete staging pieces
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/audio/
          git rm -r .upload-staging/fix-audio
          git commit -m "Restore four corrupted example MP3 recordings"
          git push origin HEAD:main
