name: Publish 1914 Symphony audio
on:
  push:
    paths:
      - '.upload-staging/1914/**'
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Reconstruct and verify MP3
        shell: bash
        run: |
          set -euo pipefail
          cat .upload-staging/1914/part-*.b64 | base64 --decode > assets/audio/1914-lyrical-symphony.mp3
          echo "11002355a47b1601f4730e0110f96ffae68ba95a44d1b65354fcff65a1036157  assets/audio/1914-lyrical-symphony.mp3" | sha256sum --check
          test "$(wc -c < assets/audio/1914-lyrical-symphony.mp3)" -eq 4465772
      - name: Commit audio and remove transfer parts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/audio/1914-lyrical-symphony.mp3
          git rm -r .upload-staging/1914
          git commit -m "Publish 1914 Lyrical Symphony MP3"
          git push origin HEAD:main
